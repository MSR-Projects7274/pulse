{% extends "base.html" %}

{% block title %}Delete Post - Pulse{% endblock %}

{% block content %}
    <div class="form-page">
      <div class="form-card danger-card">
        <h1>Delete Post</h1>

        <p class="delete-warning">
          Are you sure you want to permanently delete:
        </p>

        <h2>"{{ post.title }}"</h2>

        <form method="POST">
          {% csrf_token %}

          <div class="form-actions">
            <button type="submit" class="button danger">Delete Forever</button>

            <a href="{% url 'post_detail' post.pk %}" class="button secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
{% endblock %}
