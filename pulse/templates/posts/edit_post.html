{% extends "base.html" %}

{% block title %}Edit Post - Pulse{% endblock %}

{% block content %}
    <div class="form-page">
      <div class="form-card">
        <h1>Edit Post</h1>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %} {{ form.as_p }}

          <div class="form-actions">
            <button type="submit" class="button">Save Changes</button>

            <a href="{% url 'post_detail' post.pk %}" class="button secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
{% endblock %}
