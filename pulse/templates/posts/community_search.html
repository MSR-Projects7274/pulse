{% extends "base.html" %}

{% block title %}Search Communities - Pulse{% endblock %}

{% block content %}
    <div class="container">
      <h1>Community Search</h1>

      {% for department in departments %}

      <div class="post-card">
        <a href="{% url 'department_posts' department.id %}">
          {{ department.name }}
        </a>
      </div>

      {% empty %}

      <div class="post-card">No communities found.</div>

      {% endfor %}
    </div>
{% endblock %}
