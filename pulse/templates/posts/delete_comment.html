{% extends "base.html" %}

{% block title %}Delete Comment - Pulse{% endblock %}

{% block content %}
    <div class="form-page">
      <div class="form-card danger-card">
        <h1>Delete Comment</h1>

        <p class="delete-warning">
          Are you sure you want to permanently delete this comment?
        </p>

        <blockquote class="comment-preview">{{ comment.content }}</blockquote>

        <form method="POST">
          {% csrf_token %}

          <div class="form-actions">
            <button type="submit" class="button danger">Delete Forever</button>

            <a
              href="{% url 'post_detail' comment.post.pk %}"
              class="button secondary"
            >
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
{% endblock %}
